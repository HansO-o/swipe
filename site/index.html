  /* Layout: a phone app floating in a lavender studio. Pages are clear glass sliding over a shared

  :root {

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --swipe-page-bg: transparent;
    color-scheme: light;
  }
