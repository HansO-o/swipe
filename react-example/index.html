<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe Router 示例</title>
<meta name="theme-color" content="#eef1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swipe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #eef1f4; --page: #fbfcfd; --ink: #16212b; --ink-2: #5b6772; --line: #e3e8ec;
    --accent: #0c7f8a; --accent-ink: #fff; --warn: #c8472f; color-scheme: light;
    --swipe-page-bg: var(--page);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1015; --page: #121a21; --ink: #e6eef3; --ink-2: #93a1ad; --line: #222d36;
      --accent: #46c6d2; --accent-ink: #062a2e; --warn: #ff8a70; color-scheme: dark; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
  #root { position: fixed; inset: 0; }
  .app { max-width: 720px; margin: 0 auto; box-shadow: 0 0 0 1px var(--line); }
  .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .back { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--accent);
    font-size: 30px; line-height: 1; cursor: pointer; }
  .body { padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 72px); display: flex; flex-direction: column; gap: 14px; }
  .lead { margin: 0; color: var(--ink-2); }
  .ver { margin: 0; justify-self: start; align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); font: 600 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
  .list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .list li + li { border-top: 1px solid var(--line); }
  .list a { display: flex; align-items: center; gap: 12px; padding: 13px 14px; color: inherit; text-decoration: none; }
  .list a:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .chev { margin-left: auto; color: var(--ink-2); font-size: 20px; }
  .hero { height: 200px; border-radius: 18px; display: grid; place-items: center; color: #fff; font-size: 48px; font-weight: 700; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .button { display: inline-block; padding: 10px 18px; border: 0; border-radius: 999px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .button.ghost { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .button.warn { background: var(--warn); color: #fff; }
  .field { display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-size: 14px; }
  .field input { font: inherit; color: var(--ink); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .hint { margin: 0; color: var(--ink-2); font-size: 14px; }
  .confirm { padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 10%, var(--page)); }
  .confirm p { margin: 0 0 10px; font-weight: 600; }
  p { margin: 0; }
  .hud { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding: 6px 12px; border-radius: 10px; background: rgba(16, 24, 31, 0.78); color: #fff; white-space: nowrap;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; pointer-events: none; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
